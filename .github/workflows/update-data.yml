name: DSE ডেটা আপডেট

on:
  schedule:
    - cron: '50 8 * * 0-4'
    - cron: '35 9 * * 0-4'
    - cron: '25 10 * * 0-4'
    - cron: '40 11 * * 0-4'
    - cron: '10 13 * * 0-4'
    - cron: '40 16 * * 0-4'
    - cron: '25 1 * * 1-5'
    - cron: '15 2 * * 0-4'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'প্রথমবার সব কোম্পানির ইতিহাস নামাবেন? (true বা false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: dse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ─── সব নির্ভরতা একবারে ইনস্টল ───
      - name: নির্ভরতা ইনস্টল করুন
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas requests beautifulsoup4 lxml bdshare
          pip install playwright
          playwright install chromium
        continue-on-error: true

      - name: টেস্ট চালান
        run: python tests/test_update_data.py
        continue-on-error: true

      - name: ইনডেক্স ডিবাগ
        run: python scripts/debug_index.py
        continue-on-error: true

      - name: ইতিহাস নামান (শুধু প্রথমবার)
        if: ${{ github.event.inputs.bootstrap == 'true' }}
        run: python scripts/update_data.py --bootstrap --days 400

      - name: আজকের ডেটা যোগ করুন
        if: ${{ github.event.inputs.bootstrap != 'true' }}
        run: python scripts/update_data.py

      # ─── নিউজ সবসময় (কন্ডিশন ছাড়া) ───
      - name: শেয়ারবাজারের খবর সংগ্রহ করুন
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: সেক্টর সামারি হিসাব
        run: python scripts/compute_sectors.py
        continue-on-error: true
        
      - name: পরিবর্তন সেভ করুন
        run: |
          git config user.name "dse-data-bot"
          git config user.email "dse-data-bot@users.noreply.github.com"
          git add docs/data data -A
          if git diff --cached --quiet; then
            echo "নতুন ডেটা নেই (ছুটির দিন বা আগেই যোগ হয়েছে)"
            exit 0
          fi
          git commit -m "data: $(date -u +%F)"
          git pull --rebase -X ours origin main || {
            echo "Rebase ব্যর্থ, merge দিয়ে চেষ্টা করছি..."
            git rebase --abort || true
            git pull --no-rebase -X ours origin main
          }
          git push
