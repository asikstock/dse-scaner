name: DSE ডেটা আপডেট

on:
  schedule:
    # সময় UTC-তে লেখা (ঢাকা = UTC+৬)। GitHub-এর সময়সূচি "যথাসাধ্য" চেষ্টা করে, দেরি বা বাদ পড়তে পারে।
    # তাই কয়েকটি আলাদা সময়ে রাখা হয়েছে। স্ক্রিপ্ট বারবার চালালেও নিরাপদ, একই দিন দুবার যোগ হয় না।
    # ঘণ্টার শুরুতে (:00) চাপ বেশি, তাই ইচ্ছে করে অন্য মিনিট বেছেছি।
    - cron: '50 8 * * 0-4'    # ঢাকা ১৪:৫০ (রবি–বৃহ.)
    - cron: '35 9 * * 0-4'    # ঢাকা ১৫:৩৫
    - cron: '25 10 * * 0-4'   # ঢাকা ১৬:২৫
    - cron: '40 11 * * 0-4'   # ঢাকা ১৭:৪০
    - cron: '10 13 * * 0-4'   # ঢাকা ১৯:১০
    - cron: '40 16 * * 0-4'   # ঢাকা ২২:৪০ (রাতের ব্যাকআপ)
    - cron: '25 1 * * 1-5'    # পরদিন সকাল ৭:২৫ (আগের দিনের ডেটা বাদ পড়ে থাকলে ধরে নেয়)
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'প্রথমবার সব কোম্পানির ইতিহাস নামাবেন? (true বা false)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: dse-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: টেস্ট চালান
        run: python tests/test_update_data.py
        
      - name: ইনডেক্স ডিবাগ
        run: python scripts/debug_index.py

      - name: ইতিহাস নামান (শুধু প্রথমবার)
        if: ${{ github.event.inputs.bootstrap == 'true' }}
        run: python scripts/update_data.py --bootstrap --days 400

      - name: আজকের ডেটা যোগ করুন
        if: ${{ github.event.inputs.bootstrap != 'true' }}
        run: python scripts/update_data.py

      - name: পরিবর্তন সেভ করুন
        run: |
          git config user.name "dse-data-bot"
          git config user.email "dse-data-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "নতুন ডেটা নেই (ছুটির দিন বা আগেই যোগ হয়েছে)"
            exit 0
          fi
          git commit -m "data: $(date -u +%F)"
          # Conflict এড়াতে আগে remote-এর সাথে মিলিয়ে নিন — আমাদের সংস্করণ প্রাধান্য পাবে
          git pull --rebase -X ours origin main || {
            echo "Rebase ব্যর্থ, merge দিয়ে চেষ্টা করছি..."
            git rebase --abort || true
            git pull --no-rebase -X ours origin main
          }
          git push
